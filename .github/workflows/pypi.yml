name: Build and upload to PyPI

# Release flow (decisions: .ci/release_plan.py):
#  1. ngsolve-release-watcher dispatches this workflow on master with the new
#     NGSolve version.  If master is not pinned to it, the branch
#     `release-candidate` (master + a commit that only bumps the pin) is created,
#     built and published to PyPI as release candidate 2.1.<ngsolve>rcN; a pull
#     request release-candidate -> master is opened.
#  2. Further pushes to `release-candidate` publish rc2, rc3, ...
#  3. Merging the pull request changes the NGSolve pin on master: that push is
#     built, tested and published as the release 2.1.<ngsolve> (tag + GitHub release).
# A failed run can be repeated; manual dispatches default to a dry run.
name: Build and upload to PyPI

on:
  workflow_dispatch:
    inputs:
      ngsolve_version:
        description: NGSolve version (empty builds the current checkout)
        type: string
      dry_run:
        description: Build and test without uploading to PyPI
        type: boolean
        default: true
  push:
    branches: [master, release-candidate]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # pull request runs replace each other; all others queue up and never replace
  # a pending release run
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: false

env:
  PACKAGE_VERSION_VARIABLE: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_XFEM

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creates the release-candidate branch
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      skip: ${{ steps.plan.outputs.skip }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      ngsolve_version: ${{ steps.plan.outputs.ngsolve_version }}
      ref: ${{ steps.prepare.outputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install packaging
      - id: plan
        run: python .ci/release_plan.py plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_NGSOLVE: ${{ inputs.ngsolve_version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
      - id: prepare
        if: steps.plan.outputs.prepare == 'true'
        run: python .ci/release_plan.py prepare
        env:
          NGSOLVE_VERSION: ${{ steps.plan.outputs.ngsolve_version }}
          RC_BRANCH: ${{ steps.plan.outputs.branch }}

  build_wheels:
    name: Build and test wheels on ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-2022]
    env:
      CIBW_ARCHS_WINDOWS: AMD64
      CIBW_ENVIRONMENT_WINDOWS: >-
        CMAKE_GENERATOR='Visual Studio 17 2022'
        CMAKE_GENERATOR_PLATFORM=x64
    steps:
      - uses: actions/checkout@v7
        with:
          # (pull requests: the default merge commit)
          ref: ${{ github.event_name != 'pull_request' && needs.plan.outputs.ref || '' }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set the release (candidate) version
        if: needs.plan.outputs.version != ''
        shell: bash
        run: |
          echo "$PACKAGE_VERSION_VARIABLE=${{ needs.plan.outputs.version }}" >> "$GITHUB_ENV"
          echo "CIBW_ENVIRONMENT_PASS_LINUX=$PACKAGE_VERSION_VARIABLE" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@v4.2.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install wheel and test dependencies
        shell: bash
        run: |
          wheels=(wheelhouse/*-cp313-cp313-*.whl)
          python -m pip install "${wheels[0]}[test]"
      - run: python -m pytest tests/pytests
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # (pull requests: the default merge commit)
          ref: ${{ github.event_name != 'pull_request' && needs.plan.outputs.ref || '' }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set the release (candidate) version
        if: needs.plan.outputs.version != ''
        run: echo "$PACKAGE_VERSION_VARIABLE=${{ needs.plan.outputs.version }}" >> "$GITHUB_ENV"
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish_pypi:
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN_2 }}

  finalize:
    name: Tag, pull request / GitHub release
    # tags pushed by a person (mode "tag") need nothing more
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.mode != 'tag'
    needs: [plan, publish_pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      NGSOLVE_VERSION: ${{ needs.plan.outputs.ngsolve_version }}
      COMMIT: ${{ needs.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
      - name: Tag the published commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "tag v$VERSION exists already"
          else
            git tag -a "v$VERSION" -m "ngsxfem $VERSION (NGSolve $NGSOLVE_VERSION)" "$COMMIT"
            git push origin "v$VERSION"
          fi
      - name: Open the pull request release-candidate -> master
        if: needs.plan.outputs.mode == 'rc'
        continue-on-error: true  # needs "Allow GitHub Actions to create pull requests" in the repository settings
        run: |
          if [ "$(gh pr list --head release-candidate --base master --state open --json number --jq length)" = 0 ]; then
            gh pr create --head release-candidate --base master \
              --title "Release for NGSolve $NGSOLVE_VERSION" \
              --body "Release candidates for NGSolve $NGSOLVE_VERSION are built from this branch (latest: \`$VERSION\` on PyPI). Merging it publishes the release; the changed NGSolve pin on master triggers it."
          fi
      - name: GitHub release
        if: needs.plan.outputs.mode == 'release'
        run: |
          gh release view "v$VERSION" > /dev/null 2>&1 || \
            gh release create "v$VERSION" --title "v$VERSION" --verify-tag --generate-notes
          # the merged release-candidate branch is not needed any more
          git fetch origin release-candidate || exit 0
          if git merge-base --is-ancestor FETCH_HEAD "$COMMIT"; then
            git push origin --delete release-candidate
          fi
