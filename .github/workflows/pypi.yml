name: Build and upload to PyPI

on:
  workflow_dispatch:
    inputs:
      ngsolve_version:
        description: NGSolve version (empty builds the current checkout)
        type: string
      dry_run:
        description: Build and test without uploading to PyPI
        type: boolean
        default: true
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build_wheels:
    name: Build and test wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-2022]
    env:
      CIBW_ARCHS_WINDOWS: AMD64
      CIBW_ENVIRONMENT_WINDOWS: >-
        CMAKE_GENERATOR='Visual Studio 17 2022'
        CMAKE_GENERATOR_PLATFORM=x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: PaulSt/ngsolve-release-watcher@main
        with:
          ngsolve_version: ${{ inputs.ngsolve_version }}
          dry_run: ${{ inputs.dry_run }}
      - uses: pypa/cibuildwheel@v4.2.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install wheel and test dependencies
        shell: bash
        run: |
          wheels=(wheelhouse/*-cp313-cp313-*.whl)
          python -m pip install "${wheels[0]}[test]"
      - run: python -m pytest tests/pytests
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: PaulSt/ngsolve-release-watcher@main
        id: release
        with:
          ngsolve_version: ${{ inputs.ngsolve_version }}
          dry_run: ${{ inputs.dry_run }}
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish_pypi:
    if: >-
      !inputs.dry_run && needs.build_sdist.outputs.published != 'true' &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.ngsolve_version != '')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN_2 }}
