name: Documentation (GitHub Pages)
# Builds the sphinx documentation (.ci/build_docs.sh) and publishes it on GitHub Pages.
# Started manually; needs "Settings -> Pages -> Source: GitHub Actions" to be enabled once.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install ngsxfem (on pip ngsolve)
        run: |
          pip install ngsolve numpy scipy matplotlib ipykernel ipywidgets webgui_jupyter_widgets
          pip install -r doc/sphinx/requirements.txt
          mkdir build install
          cd build
          cmake -DBUILD_NGSOLVE=OFF -DBUILD_ON_PIP_NGSOLVE=ON -DCMAKE_INSTALL_PREFIX=../install ..
          make -j4 install
      - name: build documentation
        run: bash .ci/build_docs.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
