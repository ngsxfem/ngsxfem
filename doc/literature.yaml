# ---------------------------------------------------------------------------
# Scientific literature using ngsxfem -- data file
#
# This file is the single source of truth for
#   * doc/literature.md                            (Markdown: GitHub + PDF)
#   * doc/sphinx/xfem_misc/literature_entries.rst  (Sphinx documentation page)
# Both files are generated by
#     python3 doc/make_literature.py
# (needs PyYAML). The Sphinx build (doc/sphinx/conf.py) regenerates them
# automatically as well.
#
# To add a publication, append an entry to `entries` (see the field reference
# below), run the script and commit this file together with the generated
# files.
#
# Entry fields
#   key         unique identifier (used as HTML anchor), e.g. LR16
#   type        article | preprint | inproceedings | incollection |
#               phdthesis | mastersthesis | bachelorsthesis | software | dataset
#   authors     list of names in "C. Lehrenfeld" style
#   title       title (plain text)
#   journal     journal (article) or book title (proceedings / collections)
#   series      optional, e.g. "Lecture Notes in Computational Science and Engineering"
#   publisher   optional
#   school      university (theses)
#   volume, number, pages   (pages may also be an article number)
#   year        year of publication (preprints: year of the preprint)
#   doi         DOI (without https://doi.org/)
#   arxiv       arXiv identifier (without "arXiv:")
#   hdl         handle identifier
#   url         additional URL (e.g. thesis PDF or project page) if there is no DOI
#   code        list of code / data links, each with
#                 url, optional label (default derived from the host),
#                 optional doi (e.g. a Zenodo DOI)
#   categories  list of category ids (see `categories`)
#   note        optional remark shown after the reference
# ---------------------------------------------------------------------------

