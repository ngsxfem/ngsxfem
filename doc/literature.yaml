categories:
  - id: unfitted-bvp
    title: Unfitted boundary value problems
    description: >-
      Fictitious domain, CutFEM, unfitted DG and Trefftz methods for boundary
      value problems on level set domains, including the analysis of the
      higher order geometry handling.
  - id: interface
    title: Interface problems and two-phase flows
    description: >-
      Nitsche-XFEM / CutFEM discretizations of scalar and Stokes interface
      problems, two-phase flows and the corresponding preconditioners.
  - id: spacetime
    title: "Moving domains: space-time methods"
    description: >-
      Unfitted space-time finite element methods for PDEs on moving domains.
  - id: eulerian
    title: "Moving domains: Eulerian time-stepping"
    description: >-
      Unfitted finite element methods on moving domains with time-stepping on a
      fixed background mesh (ghost-penalty extension, BDF schemes, narrow band
      methods).
  - id: fsi
    title: Fluid-structure interaction, contact and fracture
    description: >-
      Fully Eulerian unfitted methods for fluid-rigid body and fluid-structure
      interaction, including contact and phase-field fracture.
  - id: surface
    title: PDEs on surfaces (TraceFEM)
    description: >-
      Trace finite element methods for scalar and vector-valued PDEs on
      stationary and evolving surfaces.
  - id: optimization
    title: Optimization, inverse problems and model order reduction
    description: >-
      Shape optimization, PDE-constrained optimal control, unique continuation /
      data assimilation and reduced order modelling with unfitted
      discretizations.
  - id: applications
    title: Further applications and benchmarks
    description: >-
      Works in which ngsxfem is used for other applications, for fitted
      space-time discretizations or as one of several benchmarked codes.
  - id: software
    title: Software building on ngsxfem
    description: >-
      Libraries and solver collections that build on top of ngsxfem.

