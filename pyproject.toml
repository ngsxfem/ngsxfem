[project]
name = "xfem"
dynamic = ["version"]
authors = [{name="Christoph Lehrenfeld", email= "lehrenfeld@math.uni-goettingen.de"}]
description = "(ngs)xfem is an Add-on library to Netgen/NGSolve for unfitted/cut FEM."
urls = {github="https://github.com/ngsxfem/ngsxfem"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ngsolve==6.2.2607"]
classifiers = [
  "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
]

[build-system]
requires = [
  "ngsolve==6.2.2607",
  "setuptools>=45",
  "setuptools_scm>=8",
  "scikit-build-core>=0.9.0",
  "pybind11_stubgen",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.26.1"
ninja.version = ">=1.11"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["python/_version.py"]

[tool.setuptools_scm]
write_to = "python/_version.py"
local_scheme = "no-local-version"

[project.optional-dependencies]
test = ["pytest", "scipy", "psutil"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
manylinux-x86_64-image = "cerbsim/manylinux_2_28_x86_64_cuda_12.9"
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
test-command = "python -c \"import xfem\""
skip = """
  *_i686
  *musllinux*
  *win32
"""

[tool.cibuildwheel.windows]
repair-wheel-command = ""

[tool.cibuildwheel.linux]
repair-wheel-command = "mv {wheel} {dest_dir} && rename linux_x86_64 manylinux_2_28_x86_64.manylinux2014_x86_64 {dest_dir}/*-linux_x86_64*.whl"

[tool.cibuildwheel.macos]
environment = {MACOSX_DEPLOYMENT_TARGET="10.15"}
repair-wheel-command = ""
archs = ["universal2"]

